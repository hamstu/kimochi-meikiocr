[package]
name = "meikiocr"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Local Japanese game text OCR with ONNX Runtime hardware acceleration"

[features]
default = ["coreml", "cuda", "directml"]
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
directml = ["ort/directml"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ndarray = "0.16"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
unicode-general-category = "1"

[dev-dependencies]
serde_json = "1"
